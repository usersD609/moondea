name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [wasm-gc, wasm, js, native]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install pinned official MoonBit
        shell: bash
        run: |
          curl --fail --location --silent --show-error --retry 2 https://cli.moonbitlang.com/install/unix.sh -o /tmp/install-moonbit.sh
          echo "46495f8cdc0050f79b6cb195d66478d101cb3601d68506568fbe377fcdf2a9fe  /tmp/install-moonbit.sh" | sha256sum -c -
          bash /tmp/install-moonbit.sh '0.10.18+6c83a7f62'
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Verify toolchain and public interface
        run: |
          moon version --all
          moon version --all | grep -F 'moonc v0.10.18+6c83a7f62'
          node --version
          gcc --version
          moon info
          moon fmt --check
          git diff --exit-code -- '*.mbti'
      - name: Strict checks builds and tests
        run: |
          moon check --deny-warn --target ${{ matrix.target }}
          moon test --deny-warn --target ${{ matrix.target }}
          moon build --deny-warn --target ${{ matrix.target }}
      - name: Execute three downstream workflows
        run: |
          moon run examples/operations --deny-warn --target ${{ matrix.target }}
          moon run examples/integration --deny-warn --target ${{ matrix.target }}
          moon run examples/research --deny-warn --target ${{ matrix.target }}
      - name: Source inventory
        run: python3 tools/audit_source.py
  independent-oracle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Recompute all 512 HiGHS expectations
        run: |
          python -m pip install --disable-pip-version-check scipy==1.14.1
          cp tools/oracle-fixtures.json /tmp/expected.json
          python tools/generate_oracles.py
          python -c "import json,math; a=json.load(open('/tmp/expected.json')); b=json.load(open('tools/oracle-fixtures.json')); assert a['seed']==b['seed']; assert len(a['cases'])==len(b['cases'])==32; assert all(math.isclose(x['value'],y['value'],rel_tol=1e-7,abs_tol=1e-7) for p,q in zip(a['cases'],b['cases']) for x,y in zip(p['expectations'],q['expectations']))"
